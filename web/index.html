<!DOCTYPE html>
<html>
<head>
    <!--
      If you are serving your web app in a path other than the root, change the
      href value below to reflect the base path you are serving from.

      The path provided below has to start and end with a slash "/" in order for
      it to work correctly.

      For more details:
      * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

      This is a placeholder for base href that will be replaced by the value of
      the `--base-href` argument provided to `flutter build`.
    -->
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="A new Flutter project.">

    <!-- iOS meta tags & icons -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="credit_payadvice_receiving">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>credit_payadvice_receiving</title>
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <script>
        // Prints a PDF blob URL through a hidden iframe. Only one iframe is kept:
        // each one holds a full PDF viewer, so adding a new one per voucher made
        // the tab slower and heavier over a working day.
        var printFrame = null;
        var printUrl = null;
        function autoPrint(url) {
            if (printFrame) printFrame.remove();
            if (printUrl) URL.revokeObjectURL(printUrl);
            printUrl = url;
            printFrame = document.createElement('iframe');
            printFrame.style.cssText = 'position:fixed;right:0;bottom:0;border:0;visibility:hidden';
            printFrame.onload = function () {
                this.contentWindow.focus();
                this.contentWindow.print();
            };
            printFrame.src = url;
            document.body.appendChild(printFrame);
        }
    </script>
    <script>
        // If pdf.js is not ready yet, the printing package would fetch it from
        // unpkg.com; this makes it load our local copy instead.
        window.dartPdfJsBaseUrl = 'assets/pdfjs/';
    </script>
    <!-- Deferred so it no longer blocks the app from starting; only needed for PDF previews. -->
    <script src="assets/pdfjs/pdf.min.js" defer
        onload="pdfjsLib.GlobalWorkerOptions.workerSrc = 'assets/pdfjs/pdf.worker.min.js'"></script>
    <script src="flutter_bootstrap.js" async></script>
</body>
</html>
